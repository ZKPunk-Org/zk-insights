name: PHJ-FRI Stage 3 algebra core

on:
  push:
    branches:
      - research/phj-fri-stage3-lean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-algebra-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: proximity-prize/proximity-prize
          ref: b3fac81ad2b1ee609672b04bd3c3ee1ca5c06884
          path: proximity-prize
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proximity-prize
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: auto
          use-github-cache: true
      - name: Build minimal upstream dependencies
        run: |
          cd proximity-prize
          lake build \
            ProximityPrize.SubmissionLower.MatrixRootMultiplicity \
            ProximityPrize.SubmissionLower.PlaneResultantPointCount
      - name: Kernel-check algebra core
        run: |
          for f in \
            PHJ_FRI_FiniteAlgebraProjection.lean \
            PHJ_FRI_SylvesterQuotientLength.lean \
            PHJ_FRI_IrreducibleFactorMultiplicity.lean \
            PHJ_FRI_PrimeFactorDegreeLedger.lean \
            PHJ_FRI_ClosedPointResultantLedger.lean \
            PHJ_FRI_FiberComponentLength.lean \
            PHJ_FRI_ClosedPointTowerLength.lean \
            PHJ_FRI_AggregatePrimeSeedIncidence.lean \
            PHJ_FRI_CommonFactorSylvester.lean \
            PHJ_FRI_BigradedKoszulLength.lean; do
            cp "research/phj-fri-stage3/$f" "proximity-prize/$f"
          done
          cd proximity-prize
          for f in \
            PHJ_FRI_FiniteAlgebraProjection.lean \
            PHJ_FRI_SylvesterQuotientLength.lean \
            PHJ_FRI_IrreducibleFactorMultiplicity.lean \
            PHJ_FRI_PrimeFactorDegreeLedger.lean \
            PHJ_FRI_ClosedPointResultantLedger.lean \
            PHJ_FRI_FiberComponentLength.lean \
            PHJ_FRI_ClosedPointTowerLength.lean \
            PHJ_FRI_AggregatePrimeSeedIncidence.lean \
            PHJ_FRI_CommonFactorSylvester.lean \
            PHJ_FRI_BigradedKoszulLength.lean; do
            lake env lean "$f" 2>&1 | tee "../${f%.lean}.log"
          done
      - name: Reject sorry placeholders
        run: |
          if grep -nE '(^|[^A-Za-z])sorry([^A-Za-z]|$)' \
              research/phj-fri-stage3/*.lean; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phj-fri-stage3-algebra-core-logs
          path: '*.log'
          if-no-files-found: warn