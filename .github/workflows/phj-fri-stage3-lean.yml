name: PHJ-FRI Stage 3 Lean verification

on:
  push:
    branches:
      - research/phj-fri-stage3-lean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4

      - name: Checkout pinned Proximity Prize workspace
        uses: actions/checkout@v4
        with:
          repository: proximity-prize/proximity-prize
          ref: b3fac81ad2b1ee609672b04bd3c3ee1ca5c06884
          path: proximity-prize

      - name: Set up pinned Lean and dependencies
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proximity-prize
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: auto
          use-github-cache: true

      - name: Build pinned PHJ-FRI dependencies
        shell: bash
        run: |
          cd proximity-prize
          lake build \
            ProximityPrize.SubmissionLower.CoordinateBoxZeroCount \
            ProximityPrize.SubmissionLower.PlaneResultantPointCount \
            ProximityPrize.SubmissionLower.BCHKSBridge

      - name: Copy Stage 3 modules into pinned workspace
        shell: bash
        run: |
          for f in \
            PHJ_FRI_K14_Arithmetic.lean \
            PHJ_FRI_SeedAnchored.lean \
            PHJ_FRI_AnchoredBoxZeroCount.lean \
            PHJ_FRI_FrobeniusCoordinate.lean \
            PHJ_FRI_FiniteAlgebraProjection.lean \
            PHJ_FRI_PoleBoundedCoordinate.lean \
            PHJ_FRI_SylvesterQuotientLength.lean \
            PHJ_FRI_ResultantMultiplicityLedger.lean \
            PHJ_FRI_DirectThreshold.lean \
            PHJ_FRI_M14_ConditionalArithmetic.lean \
            PHJ_FRI_M14_SharpConditionalArithmetic.lean; do
            cp "research/phj-fri-stage3/$f" "proximity-prize/$f"
          done

      - name: Kernel-check Stage 3 modules
        shell: bash
        run: |
          cd proximity-prize
          for f in \
            PHJ_FRI_K14_Arithmetic.lean \
            PHJ_FRI_SeedAnchored.lean \
            PHJ_FRI_AnchoredBoxZeroCount.lean \
            PHJ_FRI_FrobeniusCoordinate.lean \
            PHJ_FRI_FiniteAlgebraProjection.lean \
            PHJ_FRI_PoleBoundedCoordinate.lean \
            PHJ_FRI_SylvesterQuotientLength.lean \
            PHJ_FRI_ResultantMultiplicityLedger.lean \
            PHJ_FRI_DirectThreshold.lean \
            PHJ_FRI_M14_ConditionalArithmetic.lean \
            PHJ_FRI_M14_SharpConditionalArithmetic.lean; do
            lake env lean "$f" 2>&1 | tee "../${f%.lean}.log"
          done

      - name: Reject sorry placeholders
        shell: bash
        run: |
          if grep -nE '(^|[^A-Za-z])sorry([^A-Za-z]|$)' \
              research/phj-fri-stage3/*.lean; then
            echo 'Unexpected sorry placeholder found.' >&2
            exit 1
          fi

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phj-fri-stage3-lean-logs
          path: '*.log'
          if-no-files-found: warn
