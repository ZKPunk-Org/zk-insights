name: PHJ-FRI Stage 3 abstract Lean verification

on:
  push:
    branches:
      - research/phj-fri-stage3-lean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-abstract-stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4

      - name: Checkout pinned Lean workspace
        uses: actions/checkout@v4
        with:
          repository: proximity-prize/proximity-prize
          ref: b3fac81ad2b1ee609672b04bd3c3ee1ca5c06884
          path: proximity-prize

      - name: Set up pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proximity-prize
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: auto
          use-github-cache: true

      - name: Kernel-check Mathlib-only Stage 3 files
        shell: bash
        run: |
          cp research/phj-fri-stage3/PHJ_FRI_K14_Arithmetic.lean proximity-prize/
          cp research/phj-fri-stage3/PHJ_FRI_SeedAnchored.lean proximity-prize/
          cp research/phj-fri-stage3/PHJ_FRI_FiniteAlgebraProjection.lean proximity-prize/
          cp research/phj-fri-stage3/PHJ_FRI_M14_ConditionalArithmetic.lean proximity-prize/
          cd proximity-prize
          for f in \
            PHJ_FRI_K14_Arithmetic.lean \
            PHJ_FRI_SeedAnchored.lean \
            PHJ_FRI_FiniteAlgebraProjection.lean \
            PHJ_FRI_M14_ConditionalArithmetic.lean; do
            lake env lean "$f" 2>&1 | tee "../${f%.lean}.log"
          done

      - name: Reject sorry placeholders
        shell: bash
        run: |
          if grep -nE '(^|[^A-Za-z])sorry([^A-Za-z]|$)' \
              research/phj-fri-stage3/PHJ_FRI_K14_Arithmetic.lean \
              research/phj-fri-stage3/PHJ_FRI_SeedAnchored.lean \
              research/phj-fri-stage3/PHJ_FRI_FiniteAlgebraProjection.lean \
              research/phj-fri-stage3/PHJ_FRI_M14_ConditionalArithmetic.lean; then
            exit 1
          fi

      - name: Upload abstract verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phj-fri-stage3-abstract-lean-logs
          path: '*.log'
          if-no-files-found: warn
