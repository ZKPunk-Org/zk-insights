name: PHJ-FRI Stage 3 certified algebra core

on:
  push:
    branches:
      - research/phj-fri-stage3-lean
    paths:
      - 'research/phj-fri-stage3/PHJ_FRI_BigradedKoszulLength.lean'
      - 'research/phj-fri-stage3/PHJ_FRI_FiniteFiltrationSurjection.lean'
      - 'research/phj-fri-stage3/PHJ_FRI_GenericFiberMixedDegree.lean'
      - '.github/workflows/phj-fri-stage3-certified-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: proximity-prize/proximity-prize
          ref: b3fac81ad2b1ee609672b04bd3c3ee1ca5c06884
          path: proximity-prize
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proximity-prize
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: auto
          use-github-cache: true
      - name: Kernel-check certified core
        run: |
          for f in \
            PHJ_FRI_BigradedKoszulLength.lean \
            PHJ_FRI_FiniteFiltrationSurjection.lean \
            PHJ_FRI_GenericFiberMixedDegree.lean; do
            cp "research/phj-fri-stage3/$f" "proximity-prize/$f"
          done
          cd proximity-prize
          lake env lean PHJ_FRI_BigradedKoszulLength.lean 2>&1 | tee ../PHJ_FRI_BigradedKoszulLength.certified.log
          lake env lean PHJ_FRI_FiniteFiltrationSurjection.lean 2>&1 | tee ../PHJ_FRI_FiniteFiltrationSurjection.certified.log
          lake env lean PHJ_FRI_GenericFiberMixedDegree.lean 2>&1 | tee ../PHJ_FRI_GenericFiberMixedDegree.certified.log
      - name: Reject sorry placeholders
        run: |
          if grep -nE '(^|[^A-Za-z])sorry([^A-Za-z]|$)' \
              research/phj-fri-stage3/PHJ_FRI_BigradedKoszulLength.lean \
              research/phj-fri-stage3/PHJ_FRI_FiniteFiltrationSurjection.lean \
              research/phj-fri-stage3/PHJ_FRI_GenericFiberMixedDegree.lean; then
            exit 1
          fi
      - name: Write kernel certificate
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          cat > research/phj-fri-stage3/CI_CERTIFIED_ALGEBRA_CORE.md <<EOF
          # PHJ-FRI Stage 3 certified algebra core

          Status: PASS

          Verified source commit: \`${VERIFIED_SHA}\`

          Pinned dependency: \`proximity-prize/proximity-prize@b3fac81ad2b1ee609672b04bd3c3ee1ca5c06884\`

          Pinned Lean toolchain: \`v4.32.2\`

          Kernel-checked files:

          - \`PHJ_FRI_BigradedKoszulLength.lean\`
          - \`PHJ_FRI_FiniteFiltrationSurjection.lean\`
          - \`PHJ_FRI_GenericFiberMixedDegree.lean\`

          The workflow also rejected any \`sorry\` placeholder in these files.
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/phj-fri-stage3/CI_CERTIFIED_ALGEBRA_CORE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: certify Stage 3 algebra core [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phj-fri-stage3-certified-core-logs
          path: '*.certified.log'
          if-no-files-found: warn